name: Validate RankStudy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://rankstudy:test_only@localhost:5432/rankstudy_test
      E2E_DATABASE_URL: postgresql://rankstudy:test_only@localhost:5432/rankstudy_test
      WEB_ORIGIN: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: 1025
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rankstudy
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: rankstudy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rankstudy -d rankstudy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://rankstudy:test_only@localhost:5432/rankstudy_test
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
